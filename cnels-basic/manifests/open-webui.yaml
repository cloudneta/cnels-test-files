---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: llm
  name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: cnels-cpu
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: webui
        image: ghcr.io/open-webui/open-webui:v0.13.3
        ports:
        - containerPort: 8080
        env:
        - name: ENABLE_OLLAMA_API
          value: 'false'
        - name: OPENAI_API_BASE_URL
          value: http://vllm.llm.svc.cluster.local:8000/v1
        - name: OPENAI_API_KEY
          value: not-needed
        - name: DEFAULT_MODEL_METADATA
          value: '{"capabilities":{"builtin_tools":false}}'
        readinessProbe:
          httpGet:
            path: "/health"
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
